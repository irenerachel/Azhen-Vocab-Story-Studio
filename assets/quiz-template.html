<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap">
<style>
/* 寒蝉圆黑体（SIL OFL 1.1，github.com/Warren2060/ChillRoundGothic），只截取本页用到的字 */
@font-face { font-family: "ChillRound"; font-weight: 400 500; font-display: swap; src: url(data:font/woff2;base64,__FONT_MEDIUM__) format("woff2") }
@font-face { font-family: "ChillRound"; font-weight: 600 900; font-display: swap; src: url(data:font/woff2;base64,__FONT_BOLD__) format("woff2") }
/* 布局：单栏故事书。上方舞台先放动画，播完原地换成生词挑战；下方是 15 个生词的词表。进度用星座表示 */
/* 布局：单栏故事书。上方舞台先放动画，播完原地换成生词挑战；下方是生词表。背景是一层动态星空画布，鼠标带出星光 */
:root {
  /* 天空（页面） */
  --sky: #141C34; --sky-2: #1F2A4A; --sky-line: #3A4870; --on-sky: #EDE6D6; --on-sky-soft: #AEB6CC; --sky-accent: #F4D58D;
  /* 卡片（舞台） */
  --card: #F3EAD6; --card-ink: #2B2320; --card-soft: #5B4C42; --card-raise: #FBF5E8; --card-hover: #FFFFFF; --card-well: #E9DDC3; --tick: #CDBF9F;
  --word: #A63E14; --word-line: #D9893F; --ok: #1F5E7A;
  /* 通用 */
  --glass: #9CCFEA; --gold: #F4D58D; --miss: #C4563A; --wrong-bg: #F2C7B5; --on-color: #1B2236;
  --f-display: "ChillRound", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --f-en: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "ChillRound", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { background: var(--sky); color: var(--on-sky); transition: background-color .6s }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none }
.wrap { position: relative; z-index: 1 }
body {
  font-family: var(--f-body); font-weight: 500; font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px }
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px 16px }
.head-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 auto }
.eyebrow { font-size: 13px; letter-spacing: 0.12em; color: var(--sky-accent) }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 6vw, 56px); line-height: 1.15; letter-spacing: 0.02em; text-wrap: balance; color: var(--on-sky) }
.en-title { font-family: var(--f-en); font-style: italic; font-weight: 600; font-size: clamp(18px, 2.4vw, 22px); color: var(--on-sky-soft) }

/* 舞台 */
.stage { position: relative; transition: background-color .6s, color .6s; background: var(--card); color: var(--card-ink); border: 4px solid var(--card-ink); border-radius: 26px 14px 30px 12px; overflow: hidden }
.video-box { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000 }
.video-box video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000 }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 18px; border-top: 3px solid var(--card-ink) }
.steps { display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px }
.step { padding: 5px 14px; border-radius: 999px; border: 2px solid var(--card-soft); color: var(--card-soft); background: transparent; font-size: 14px }
.step:hover { border-color: var(--card-ink); color: var(--card-ink) }
.step:focus-visible { outline: 3px solid var(--glass); outline-offset: 3px }
.step.on { background: var(--card-ink); color: var(--card); border-color: var(--card-ink) }
.step.done { border-color: var(--card-ink); color: var(--card-ink) }
button { font: inherit; cursor: pointer }
.btn { padding: 9px 18px; border-radius: 12px; border: 3px solid var(--card-ink); background: var(--card); color: var(--card-ink); font-weight: 600 }
.btn.primary { background: var(--card-ink); color: var(--card) }
.btn:hover { transform: translateY(-1px) }
.btn:focus-visible, .opt:focus-visible, .chip:focus-visible, .listen:focus-visible { outline: 3px solid var(--glass); outline-offset: 3px }

/* 生词挑战 */
.quiz { display: grid; grid-template-columns: 220px 1fr; gap: 28px; padding: 28px; min-height: 520px }
.quiz-side { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center }
.clock { width: 180px; max-width: 100%; height: auto }
.count { font-family: var(--f-en); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums }
.count small { font-family: var(--f-body); font-weight: 400; font-size: 13px; color: var(--card-soft); display: block }
.q { display: flex; flex-direction: column; gap: 16px; min-width: 0 }
.q-type { font-size: 13px; letter-spacing: 0.1em; color: var(--card-soft) }
.q-prompt { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3vw, 30px); line-height: 1.35; margin: 0; text-wrap: balance }
.q-prompt .en { font-family: var(--f-en); font-weight: 600; color: var(--word) }
.q-sentence { font-family: var(--f-en); font-weight: 600; font-size: clamp(20px, 2.6vw, 26px); line-height: 1.45; margin: 0; text-wrap: balance }
.q-sentence .blank { display: inline-block; min-width: 4.5em; border-bottom: 3px dashed var(--word); color: var(--word) }
.q-pic { align-self: center; height: 220px; max-width: 100%; display: flex; align-items: center; justify-content: center; padding: 10px; background: var(--card-well); border: 3px solid var(--card-ink); border-radius: 50%; aspect-ratio: 1 }
.q-pic img { max-height: 100%; max-width: 100%; object-fit: contain }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px 16px; border-radius: 14px; border: 3px solid var(--card-ink); color: var(--card-ink); min-height: 60px; font-size: 18px; background: var(--card-raise) }
.opt .key { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--card-soft); display: grid; place-items: center; font-size: 13px; color: var(--card-soft); font-variant-numeric: tabular-nums }
.opt.en { font-family: var(--f-en); font-weight: 600; font-size: 21px }
.opt:hover:not(:disabled) { background: var(--card-hover) }
.opt:disabled { cursor: default }
.opt.right { background: var(--glass); border-color: var(--card-ink); color: var(--on-color) }
.opt.wrong { background: var(--wrong-bg); border-color: var(--miss); color: var(--on-color) }
.opt.right .key, .opt.wrong .key { border-color: var(--on-color); color: var(--on-color) }
.feedback { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-radius: 14px; border: 3px dashed var(--card-soft); background: var(--card-raise) }
.fb-head { font-family: var(--f-display); font-weight: 700; font-size: 22px }
.fb-head.ok { color: var(--ok) } .fb-head.no { color: var(--miss) }
.fb-word { font-family: var(--f-en); font-weight: 600; font-size: 20px; color: var(--word) }
.fb-word span { font-family: var(--f-body); font-weight: 400; font-size: 15px; color: var(--card-soft); margin-left: 6px }
.fb-en { font-family: var(--f-en); font-weight: 600; font-size: 17px; line-height: 1.5 }
.fb-en mark { background: none; color: var(--word); text-decoration: underline wavy var(--word-line); text-underline-offset: 5px }
.fb-zh { font-size: 15px; color: var(--card-soft) }
.fb-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center }
.listen { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 2px solid var(--card-ink); background: var(--card); color: var(--card-ink); font-size: 14px }
.listen svg { width: 14px; height: 14px; fill: currentColor }

/* 结果 */
.result { display: grid; grid-template-columns: 220px 1fr; gap: 28px; padding: 28px; min-height: 520px }
.score { font-family: var(--f-en); font-weight: 700; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums }
.score small { font-size: 24px; color: var(--card-soft) }
.result h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 3.2vw, 32px); text-wrap: balance }
.result p { margin: 0; color: var(--card-soft) }
.review { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none }
.review li { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 10px 14px; border: 2px solid var(--card-ink); border-radius: 12px; background: var(--card-raise) }
.review .w { font-family: var(--f-en); font-weight: 600; font-size: 18px; color: var(--word) }
.review .m { color: var(--card-soft); font-size: 15px }
.actions { display: flex; flex-wrap: wrap; gap: 12px }
.best { font-size: 13px; color: var(--card-soft) }

/* 词表 */
.words h2 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 700; font-size: 26px }
.words p { margin: 0 0 14px; color: var(--on-sky-soft) }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px }
.chip { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--sky-line); background: var(--sky-2); color: var(--on-sky) }
.chip:hover { border-color: var(--glass) }
.chip .w { font-family: var(--f-en); font-weight: 600; font-size: 19px; color: var(--sky-accent) }
.chip .pos { font-family: var(--f-en); font-style: italic; font-size: 13px; color: var(--on-sky-soft) }
.chip .m { font-size: 14px }
.chip.playing { border-color: var(--glass); box-shadow: inset 0 0 0 1px var(--glass) }
footer { font-size: 13px; color: var(--on-sky-soft) }

@media (max-width: 720px) {
  .quiz, .result { grid-template-columns: 1fr; padding: 20px; gap: 18px; min-height: 0 }
  .quiz-side { flex-direction: row; justify-content: center; gap: 16px }
  .clock { width: 96px }
  .opts { grid-template-columns: 1fr }
  .q-pic { height: 170px }
  .result .quiz-side .clock { width: 110px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } .btn:hover { transform: none } }
.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) }
.clock .now { animation: pulse 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
@keyframes pulse { 50% { opacity: .35; transform: scale(1.25) } }
@keyframes pop { from { transform: scale(.94) } to { transform: scale(1) } }
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="head-text">
      <div class="eyebrow">英文动画故事 · __N__ 个生词</div>
      <h1>__TITLE__</h1>
      <div class="en-title">__EN_TITLE__</div>
    </div>
  </header>

  <section class="stage" aria-label="故事与生词挑战">
    <div id="watch">
      <div class="video-box">
        <video id="vid" controls playsinline preload="metadata" poster="img/poster.jpg">
          <source src="story.mp4" type="video/mp4">
        </video>
      </div>
    </div>
    <div id="quiz" class="quiz" hidden></div>
    <div id="result" class="result" hidden></div>
    <div class="bar">
      <div class="steps" role="group" aria-label="切换"><button class="step on" id="s1" aria-current="step">① 看故事 · __SECONDS__ 秒</button><button class="step" id="s2">② 生词挑战 · __N__ 题</button></div>
      <div class="actions">
        <button class="btn" id="toWatch" hidden>重看故事</button>
        <button class="btn primary" id="toQuiz">直接做题</button>
      </div>
    </div>
  </section>

  <section class="words" aria-labelledby="wordsTitle">
    <h2 id="wordsTitle">故事里的生词</h2>
    <p>点一个词，听它在故事里的那句话。</p>
    <div class="chips" id="chips"></div>
  </section>

  <footer>__FOOTER__</footer>
</div>
<audio id="aud" preload="none"></audio>

<script>
// ---------- 数据：与视频里的旁白、生词卡一致（由 build_quiz.py 从 quiz-data.json 填入） ----------
const DATA = __DATA_JSON__;
const LINES = DATA.lines;
const WORDS = DATA.words;   // 题型：pic 看图选词，mean 看英文选中文，fill 原句填空。顺序跟着故事走
const PIC_HINT = DATA.picHint;

// ---------- 小工具 ----------
const $ = (id) => document.getElementById(id);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 在句子里找生词：单词里的符号（a.m.、括号、撇号）按字面匹配，两边不能紧挨着别的字母，避免 ball 匹配到 football
const wordRe = (w) => new RegExp(`(?<![A-Za-z])(${esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})(?![A-Za-z])`, "i");
const slug = (w) => w.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");   // 题图文件名：img/<slug>.webp
const markWord = (sentence, w) => esc(sentence).replace(wordRe(w), "<mark>$1</mark>");
const PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>';
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// 原句播放：同一时间只播一句
const aud = $("aud"); let playingChip = null;
function playLine(line, chip) {
  const vid = $("vid"); if (!vid.paused) vid.pause();
  aud.src = `audio/${line}.mp3`; aud.currentTime = 0; aud.play().catch(() => {});
  if (playingChip) playingChip.classList.remove("playing");
  playingChip = chip || null; if (chip) chip.classList.add("playing");
}
aud.addEventListener("ended", () => { if (playingChip) playingChip.classList.remove("playing"); playingChip = null; });

// 星座进度：每答一题点亮一颗星（对：金色，错：暗红），答完连成故事主线物件的星座。星位由 constellation.py 从物件插图轮廓取点
const CONST = DATA.constellation;
function clockSVG(done, results, current) {
  const asp = CONST.aspect, w = asp >= 1 ? 150 : 150 * asp, h = asp >= 1 ? 150 / asp : 150, ox = 100 - w / 2, oy = 100 - h / 2;
  const P = CONST.points.map(([x, y]) => [ox + x * 150, oy + y * 150]);   // 坐标以较长边为 1，直接乘 150 即保持比例
  const n = P.length, lit = (i) => results[i] != null;
  let lines = "";
  for (let i = 0; i < n; i++) { const j = (i + 1) % n, [x1, y1] = P[i], [x2, y2] = P[j];
    if (lit(i) && lit(j)) lines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${results[i] && results[j] ? "var(--gold)" : "var(--tick)"}" stroke-width="2.2" stroke-linecap="round"/>`;
    else lines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--tick)" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round"/>`; }
  const star = (x, y, r) => { let d = ""; for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 - Math.PI / 2, rr = k % 2 ? r * 0.36 : r; d += `${k ? "L" : "M"}${(x + Math.cos(a) * rr).toFixed(1)} ${(y + Math.sin(a) * rr).toFixed(1)}`; } return d + "Z"; };
  const dots = P.map(([x, y], i) => {
    const ring = i === current ? `<circle cx="${x}" cy="${y}" r="11" fill="none" stroke="var(--glass)" stroke-width="2.5" class="now"/>` : "";
    if (results[i] === true) return ring + `<path d="${star(x, y, 9)}" fill="var(--gold)" stroke="var(--card-ink)" stroke-width="1.6" stroke-linejoin="round"/>`;
    if (results[i] === false) return ring + `<circle cx="${x}" cy="${y}" r="5" fill="var(--miss)" stroke="var(--card-ink)" stroke-width="1.4"/>`;
    return ring + `<circle cx="${x}" cy="${y}" r="3.2" fill="var(--tick)"/>`;
  }).join("");
  const label = done >= n ? `<text x="100" y="188" text-anchor="middle" font-family="ChillRound, sans-serif" font-weight="700" font-size="13" letter-spacing="2" fill="var(--gold)">${CONST.name}</text>` : "";
  return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="已点亮 ${done} / ${n} 颗星">
    <circle cx="100" cy="100" r="96" fill="var(--sky)" stroke="var(--card-ink)" stroke-width="4"/>${lines}${dots}${label}</svg>`;
}

// ---------- 词表 ----------
$("chips").innerHTML = WORDS.map((x, i) => `<button class="chip" data-i="${i}" aria-label="${x.w}，${x.m}，播放原句"><span class="w">${x.w}</span><span class="pos">${x.pos}</span><span class="m">${x.m}</span></button>`).join("");
$("chips").addEventListener("click", (e) => { const c = e.target.closest(".chip"); if (c) playLine(WORDS[+c.dataset.i].line, c); });

// ---------- 出题 ----------
let order = [], idx = 0, results = [], answered = false;
function optionsFor(item) {
  const others = shuffle(WORDS.filter((x) => x !== item));
  const same = others.filter((x) => x.pos === item.pos), pool = [...same, ...others.filter((x) => x.pos !== item.pos)];
  return shuffle([item, ...pool.slice(0, 3)]);
}
function startQuiz(reshuffle) {
  order = reshuffle ? shuffle(WORDS.map((_, i) => i)) : WORDS.map((_, i) => i);
  idx = 0; results = []; show("quiz"); renderQ();
}
function show(view) {
  $("watch").hidden = view !== "watch"; $("quiz").hidden = view !== "quiz"; $("result").hidden = view !== "result";
  $("s1").className = "step " + (view === "watch" ? "on" : "done"); $("s2").className = "step " + (view === "watch" ? "" : "on");
  if (view === "watch") { $("s1").setAttribute("aria-current", "step"); $("s2").removeAttribute("aria-current"); }
  else { $("s2").setAttribute("aria-current", "step"); $("s1").removeAttribute("aria-current"); }
  $("toQuiz").hidden = view !== "watch"; $("toWatch").hidden = view === "watch";
  if (view !== "watch") $("vid").pause();
  const st = document.querySelector(".stage").getBoundingClientRect();
  if (st.top < 0 || st.top > innerHeight * 0.6) document.querySelector(".stage").scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function renderQ() {
  const item = WORDS[order[idx]], opts = optionsFor(item); answered = false;
  const [en] = LINES[item.line];
  let head = "";
  if (item.type === "pic") head = `<div class="q-type">看图选词</div><p class="q-prompt">${PIC_HINT[item.w]}</p><div class="q-pic"><img src="img/${slug(item.w)}.webp" alt="故事里的一个画面"></div>`;
  if (item.type === "mean") head = `<div class="q-type">看英文选中文</div><p class="q-prompt"><span class="en">${item.w}</span> 是什么意思？</p>`;
  if (item.type === "fill") head = `<div class="q-type">故事原句填空</div><p class="q-sentence">${esc(en).replace(wordRe(item.w), '<span class="blank">______</span>')}</p>`;
  const asEn = item.type !== "mean";
  $("quiz").innerHTML = `<div class="quiz-side">${clockSVG(idx, results.length ? orderResults() : [], order[idx])}<div class="count">${idx + 1} / ${WORDS.length}<small>答一题，点亮一颗星</small></div></div>
    <div class="q">${head}<div class="opts" role="group" aria-label="选项">${opts.map((o, k) =>
      `<button class="opt ${asEn ? "en" : ""}" data-w="${esc(o.w)}" aria-label="选项 ${k + 1}：${esc(asEn ? o.w : o.m)}"><span class="key">${k + 1}</span><span>${asEn ? o.w : o.m}</span></button>`).join("")}</div>
    <div id="fb"></div></div>`;
  $("quiz").querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => answer(b)));
  $("quiz").querySelector(".opt").focus({ preventScroll: true });
}
// 结果按词在词表里的位置存，钟上的格子对应词表顺序
function orderResults() { const r = []; results.forEach((ok, k) => { r[order[k]] = ok; }); return r; }
function answer(btn) {
  if (answered) return; answered = true;
  const item = WORDS[order[idx]], ok = btn.dataset.w === item.w; results.push(ok);
  $("quiz").querySelectorAll(".opt").forEach((b) => { b.disabled = true; if (b.dataset.w === item.w) b.classList.add("right"); });
  if (!ok) btn.classList.add("wrong");
  $("quiz").querySelector(".quiz-side").firstElementChild.outerHTML = clockSVG(idx + 1, orderResults(), -1);
  const [en, zh] = LINES[item.line], last = idx === WORDS.length - 1;
  $("fb").innerHTML = `<div class="feedback pop" role="status">
    <div class="fb-row"><div class="fb-head ${ok ? "ok" : "no"}">${ok ? "答对了！" : "差一点，正确答案是："}</div>
      <div class="fb-word">${item.w}<span>${item.pos} ${item.m}</span></div></div>
    <div class="fb-en">${markWord(en, item.w)}</div><div class="fb-zh">${zh}</div>
    <div class="fb-row"><button class="listen" id="listen">${PLAY}听原句</button><button class="btn primary" id="next">${last ? "看成绩" : "下一题"}</button></div></div>`;
  $("listen").addEventListener("click", () => playLine(item.line));
  $("next").addEventListener("click", next); $("next").focus({ preventScroll: true });
}
function next() { aud.pause(); if (idx < WORDS.length - 1) { idx++; renderQ(); } else renderResult(); }
function renderResult() {
  show("result");
  const score = results.filter(Boolean).length, r = orderResults();
  const best = Math.max(score, +(store.get(DATA.slug + "-best") || 0)); store.set(DATA.slug + "-best", String(best));
  const msg = score === WORDS.length ? [DATA.perfect || "全对！", `${WORDS.length} 颗星全亮，${CONST.name}完整出现了。`]
    : score >= 11 ? ["星座快要连成了", "大部分生词已经记住了，看看下面这几个。"]
    : score >= 7 ? ["魔法还在生效中", "再听听这几句原句，然后再试一次。"]
    : ["星星才亮了几颗", "建议先重看一遍故事，留意橙色的词。"];
  const wrong = WORDS.map((x, i) => [x, i]).filter(([, i]) => r[i] === false);
  $("result").innerHTML = `<div class="quiz-side">${clockSVG(WORDS.length, r, -1)}<div class="score">${score}<small> / ${WORDS.length}</small></div><div class="best">本机最好成绩 ${best} / ${WORDS.length}</div></div>
    <div class="q"><h2>${msg[0]}</h2><p>${msg[1]}</p>
    ${wrong.length ? `<ul class="review">${wrong.map(([x]) => `<li><span><span class="w">${x.w}</span> <span class="m">${x.pos} ${x.m}</span></span><button class="listen" data-line="${x.line}">${PLAY}听原句</button></li>`).join("")}</ul>` : ""}
    <div class="actions"><button class="btn primary" id="again">打乱顺序再做一次</button><button class="btn" id="rewatch">重看故事</button></div></div>`;
  $("result").querySelectorAll(".review .listen").forEach((b) => b.addEventListener("click", () => playLine(b.dataset.line)));
  $("again").addEventListener("click", () => startQuiz(true));
  $("rewatch").addEventListener("click", rewatch);
  $("again").focus({ preventScroll: true });
}
function rewatch() { aud.pause(); show("watch"); const v = $("vid"); v.currentTime = 0; v.play().catch(() => {}); }

$("vid").addEventListener("ended", () => startQuiz(false));
// 步骤按钮：随时切回故事，或回到做到一半的题目 / 成绩
$("s1").addEventListener("click", () => { if (!$("watch").hidden) return; aud.pause(); show("watch"); });
$("s2").addEventListener("click", () => {
  if (!$("quiz").hidden || !$("result").hidden) return;
  if (results.length === WORDS.length) { renderResult(); return; }
  if (order.length && results.length) { show("quiz"); return; }
  startQuiz(false);
});

// ---------- 星空画布：会漂移闪烁的星星和流星；鼠标带出星光，并让星空轻微视差 ----------
(() => {
  const cv = $("sky"), cx = cv.getContext("2d"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, dpr = 1, stars = [], trail = [], meteor = null, nextMeteor = 3;
  const mouse = { x: 0.5, y: 0.35, tx: 0.5, ty: 0.35, px: null, py: null };
  const rnd = (a, b) => a + Math.random() * (b - a);
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(W * H / 5200);
    stars = Array.from({ length: n }, () => { const layer = Math.random() < 0.6 ? 0 : Math.random() < 0.7 ? 1 : 2;
      return { x: Math.random(), y: Math.random(), r: [0.6, 1.1, 1.7][layer] * rnd(0.8, 1.2), layer, ph: rnd(0, 6.28), sp: rnd(0.6, 1.8), gold: Math.random() < 0.18 }; });
  }
  function sparkle(x, y, r, color, alpha, rot) {
    cx.save(); cx.translate(x, y); cx.rotate(rot); cx.globalAlpha = alpha; cx.fillStyle = color; cx.beginPath();
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = k % 2 ? r * 0.28 : r; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    cx.closePath(); cx.fill(); cx.restore();
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
    mouse.x += (mouse.tx - mouse.x) * Math.min(1, dt * 3); mouse.y += (mouse.ty - mouse.y) * Math.min(1, dt * 3);
    const mx = (mouse.x - 0.5), my = (mouse.y - 0.5);
    cx.clearRect(0, 0, W, H);
    {
      const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#0E1530"); g.addColorStop(1, "#1E2A4C"); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
      for (const st of stars) {
        const depth = [6, 14, 26][st.layer];
        const x = ((st.x + (reduce ? 0 : t * 0.0015 * (st.layer + 1))) % 1) * W - mx * depth, y = st.y * H - my * depth;
        const tw = reduce ? 0.8 : 0.55 + 0.45 * Math.sin(t * st.sp + st.ph);
        if (st.layer === 2) sparkle(x, y, st.r * 2.2, st.gold ? "#F4D58D" : "#EAF2FF", tw, t * 0.2 + st.ph);
        else { cx.globalAlpha = tw; cx.fillStyle = st.gold ? "#F4D58D" : "#DCE6FF"; cx.beginPath(); cx.arc(x, y, st.r, 0, 6.29); cx.fill(); }
      }
      cx.globalAlpha = 1;
      if (!reduce) {
        nextMeteor -= dt;
        if (!meteor && nextMeteor <= 0) { meteor = { x: rnd(0.2, 0.9) * W, y: rnd(0, 0.3) * H, life: 0 }; nextMeteor = rnd(5, 11); }
        if (meteor) { meteor.life += dt; const k = meteor.life / 0.9, x = meteor.x - k * 320, y = meteor.y + k * 160;
          const gr = cx.createLinearGradient(x, y, x + 120, y - 60); gr.addColorStop(0, "rgba(255,244,214,0.9)"); gr.addColorStop(1, "rgba(255,244,214,0)");
          cx.strokeStyle = gr; cx.lineWidth = 2; cx.globalAlpha = 1 - k; cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + 120, y - 60); cx.stroke(); cx.globalAlpha = 1;
          if (k >= 1) meteor = null; }
      }
      // 鼠标处一圈淡淡的金色光晕
      if (mouse.px !== null) { const rg = cx.createRadialGradient(mouse.px, mouse.py, 0, mouse.px, mouse.py, 160); rg.addColorStop(0, "rgba(244,213,141,0.13)"); rg.addColorStop(1, "rgba(244,213,141,0)"); cx.fillStyle = rg; cx.fillRect(mouse.px - 160, mouse.py - 160, 320, 320); }
    }
    // 鼠标拖出的星光
    for (let i = trail.length - 1; i >= 0; i--) {
      const p = trail[i]; p.life -= dt; if (p.life <= 0) { trail.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 30 * dt;
      const a = p.life / p.max;
      sparkle(p.x, p.y, p.r * (0.4 + a * 0.6), p.gold ? "#F4D58D" : "#FFF6DD", a, p.rot + t);
    }
    cx.globalAlpha = 1;
    if (!reduce) req = requestAnimationFrame(frame);
  }
  let req = 0;
  addEventListener("pointermove", (e) => {
    mouse.tx = e.clientX / W; mouse.ty = e.clientY / H;
    if (reduce) return;
    if (mouse.px !== null) { const d = Math.hypot(e.clientX - mouse.px, e.clientY - mouse.py), n = Math.min(3, Math.floor(d / 14));
      for (let k = 0; k < n && trail.length < 90; k++) trail.push({ x: e.clientX + rnd(-6, 6), y: e.clientY + rnd(-6, 6), vx: rnd(-20, 20), vy: rnd(-30, 5), r: rnd(3, 7), life: 0.9, max: 0.9, rot: rnd(0, 6), gold: Math.random() < 0.6 }); }
    mouse.px = e.clientX; mouse.py = e.clientY;
  }, { passive: true });
  addEventListener("resize", () => { resize(); if (reduce) frame(performance.now()); });
  document.addEventListener("visibilitychange", () => { cancelAnimationFrame(req); if (!document.hidden && !reduce) { last = performance.now(); req = requestAnimationFrame(frame); } });
  resize(); req = requestAnimationFrame(frame);
})();
$("toQuiz").addEventListener("click", () => startQuiz(false));
$("toWatch").addEventListener("click", rewatch);
document.addEventListener("keydown", (e) => {
  if ($("quiz").hidden || e.altKey || e.ctrlKey || e.metaKey) return;
  const n = +e.key; if (n >= 1 && n <= 4 && !answered) { const b = $("quiz").querySelectorAll(".opt")[n - 1]; if (b) answer(b); }
});
</script>
